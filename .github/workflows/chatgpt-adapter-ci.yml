name: Academic Research Skills ChatGPT Adapter CI

on:
  push:
    paths:
      - 'chatgpt-adapter/**'
      - '.github/workflows/chatgpt-adapter-ci.yml'
  pull_request:
    paths:
      - 'chatgpt-adapter/**'
      - '.github/workflows/chatgpt-adapter-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chatgpt-adapter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: SDK integration and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: chatgpt-adapter/backend/requirements.txt

      - name: Install pinned MCP SDK and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r chatgpt-adapter/backend/requirements.txt 'pytest>=8,<10'

      - name: Compile all Python source
        run: >-
          python -m compileall -q
          chatgpt-adapter/backend/ars_mcp
          chatgpt-adapter/backend/tests
          chatgpt-adapter/backend/mcp_sdk_tests

      - name: Run deterministic unit and handler tests
        env:
          PYTHONPATH: chatgpt-adapter/backend:chatgpt-adapter/skills
        run: python -m unittest discover -s chatgpt-adapter/backend/tests -v

      - name: Run official MCP SDK protocol tests
        env:
          PYTHONPATH: chatgpt-adapter/backend:chatgpt-adapter/skills
        run: >-
          pytest -c chatgpt-adapter/backend/pyproject.toml -q
          chatgpt-adapter/backend/tests
          chatgpt-adapter/backend/mcp_sdk_tests

  docker-smoke:
    name: Docker, Streamable HTTP and security smoke tests
    runs-on: ubuntu-latest
    needs: python-tests
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install official MCP SDK client
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'mcp==2.3.0'

      - name: Build backend image
        run: >-
          docker build -f chatgpt-adapter/backend/Dockerfile
          -t ars-mcp-ci:${{ github.sha }} chatgpt-adapter

      - name: Run container and verify MCP, storage permissions, and HTTP protections
        env:
          ARS_CI_IMAGE: ars-mcp-ci:${{ github.sha }}
          ARS_CI_CONTAINER: ars-mcp-ci-${{ github.run_id }}
          ARS_CI_PORT: '18765'
          ARS_CI_MAX_BODY_BYTES: '1048576'
        run: python chatgpt-adapter/backend/mcp_sdk_tests/docker_http_smoke.py
